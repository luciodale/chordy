name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - name: Migrate D1 and deploy
        # Skipped until the CLOUDFLARE_API_TOKEN secret exists, so checks
        # still run and CI stays green before deploys are set up.
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          bunx wrangler d1 migrations apply chordy-db --remote
          bun run deploy
